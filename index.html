<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Codex 额度实时监控</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main class="glass high" id="card">
    <div class="orb cyan"></div><div class="orb lilac"></div><div class="orb warm"></div>
    <header><div class="caption">周剩余额度</div><nav class="no-drag"><span class="live loading" id="status" title="正在同步"></span><button id="pin" class="active" title="保持置顶">◆</button><button id="close" title="关闭">×</button></nav></header>
    <section><div class="percent"><span id="value">--</span><small>%</small></div><div class="bar"><i id="bar"></i></div><p id="reset">正在读取周额度</p></section>
  </main>
  <script src="renderer.js"></script>
</body></html>
